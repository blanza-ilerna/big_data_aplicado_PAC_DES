# CI: comprobaciones estáticas y prueba extremo a extremo del pipeline completo.
# El job e2e levanta todo el docker compose en el runner (como en Codespaces, los
# scripts Python corren en el host y Prometheus los ve por host.docker.internal).
# Los fallos se publican como anotaciones (resumen del run) para verlos sin abrir el log.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pyyaml
      - name: Python compila
        run: python -m py_compile scripts/*.py tests/*.py
      - name: Scripts de shell
        run: for f in scripts/*.sh .devcontainer/*.sh; do bash -n "$f"; done
      - name: JSON y YAML válidos
        run: |
          python - <<'EOF'
          import json, pathlib, yaml
          for p in pathlib.Path(".").rglob("*.json"):
              if ".git" not in p.parts:
                  json.loads(p.read_text(encoding="utf-8"))
          for p in list(pathlib.Path("docker").rglob("*.yml")) + [pathlib.Path("docker-compose.yml")]:
              yaml.safe_load(p.read_text(encoding="utf-8"))
          print("ok")
          EOF
      - name: docker compose config
        run: docker compose config -q

  e2e:
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt

      - name: Construir y levantar servicios
        run: docker compose up -d --build

      - name: Topic, tablas y job de Flink
        run: |
          bash scripts/init_infra.sh
          bash scripts/submit_flink_job.sh

      - name: Generador, API y comprobación extremo a extremo
        run: |
          nohup python scripts/generator.py > generator.out 2>&1 &
          nohup python scripts/api.py       > api.out       2>&1 &
          python tests/e2e_check.py --timeout 300

      - name: Relanzar con savepoint no duplica ventanas
        run: |
          bash scripts/submit_flink_job.sh --restart
          sleep 60
          python tests/e2e_check.py --timeout 120

      - name: Diagnóstico si algo falla
        if: failure()
        run: |
          # Cada bloque se publica como anotación (máx. 10 por paso)
          note() {  # note <título> <texto>
            local msg
            msg=$(printf '%s' "$2" | tail -c 3500 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::warning title=$1::$msg"
          }
          note "docker compose ps" "$(docker compose ps -a --format 'table {{.Service}}\t{{.State}}\t{{.Status}}')"
          note "Flink jobs" "$(curl -s localhost:8083/jobs/overview || true)"
          note "Flink JobManager (errores)" "$(docker logs bigdata-flink-jobmanager 2>&1 | grep -iE 'exception|error|caused by' | tail -40)"
          note "Flink TaskManager (errores)" "$(docker logs bigdata-flink-taskmanager 2>&1 | grep -iE 'exception|error|caused by' | tail -40)"
          note "Grafana (errores)" "$(docker logs bigdata-grafana 2>&1 | grep -iE 'level=error|lvl=eror' | tail -30)"
          note "Prometheus targets" "$(curl -s localhost:9090/api/v1/targets | python3 -c 'import json,sys;[print(t["labels"]["job"],t["scrapeUrl"],t["health"],t.get("lastError","")) for t in json.load(sys.stdin)["data"]["activeTargets"]]' || true)"
          note "Métricas Flink disponibles" "$(curl -s 'localhost:9090/api/v1/label/__name__/values' | python3 -c 'import json,sys;print(chr(10).join(n for n in json.load(sys.stdin)["data"] if "numRecords" in n or "RunningJobs" in n))' || true)"
          note "PostgreSQL" "$(docker exec bigdata-postgres psql -U bigdata_user -d bigdata -c 'SELECT COUNT(*), MAX(window_end) FROM ventas_por_producto' 2>&1)"
          note "generator.out" "$(tail -30 generator.out 2>&1)"
          note "api.out" "$(tail -30 api.out 2>&1)"
          docker compose logs --tail 150
