# Nota para Codespaces: el daemon Docker no ve la carpeta del workspace en la misma
# ruta, así que NO se usan bind mounts. La configuración propia (Prometheus, Grafana,
# Flink) va dentro de imágenes construidas desde docker/<servicio>/ con COPY.
# Tras editar algo en docker/:  docker compose up -d --build <servicio>
#
# Credenciales: se leen de .env si existe (ver .env.example); si no, se usan los
# valores por defecto que aparecen tras ":-".

x-flink-image: &flink-image
  build: ./docker/flink
  image: bigdata-flink:1.18.1-pyflink

# Variables que lee scripts/flink_job.py (se ejecuta dentro del JobManager)
x-flink-env: &flink-db-env
  POSTGRES_DB: ${POSTGRES_DB:-bigdata}
  POSTGRES_USER: ${POSTGRES_USER:-bigdata_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata_pass}

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    container_name: bigdata-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --check=false
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr 0.0.0.0:8082
      - --advertise-pandaproxy-addr localhost:8082
    ports:
      - "19092:19092"
      - "8082:8082"
      - "8081:8081"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    networks:
      - bigdata-network

  # Interfaz web de Redpanda: topics, mensajes, consumer groups y lag
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.19
    container_name: bigdata-redpanda-console
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
      REDPANDA_ADMINAPI_ENABLED: "true"
      REDPANDA_ADMINAPI_URLS: http://redpanda:9644
    depends_on:
      redpanda:
        condition: service_healthy
    networks:
      - bigdata-network

  prometheus:
    build: ./docker/prometheus
    image: bigdata-prometheus:2.48.1
    container_name: bigdata-prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1d
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bigdata-network

  loki:
    image: grafana/loki:2.9.3
    container_name: bigdata-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bigdata-network

  grafana:
    build: ./docker/grafana
    image: bigdata-grafana:10.2.3
    container_name: bigdata-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      # Admin para que los alumnos editen sin login; pon Viewer en .env para solo lectura
      GF_AUTH_ANONYMOUS_ORG_ROLE: ${GRAFANA_ANONYMOUS_ROLE:-Admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/pipeline.json
      # Usadas por provisioning/datasources/datasources.yml
      POSTGRES_DB: ${POSTGRES_DB:-bigdata}
      POSTGRES_USER: ${POSTGRES_USER:-bigdata_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata_pass}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bigdata-network

  flink-jobmanager:
    <<: *flink-image
    container_name: bigdata-flink-jobmanager
    restart: unless-stopped
    ports:
      - "8083:8081"
    command: jobmanager
    environment:
      <<: *flink-db-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        parallelism.default: 1
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        state.checkpoints.dir: file:///opt/flink/checkpoints/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints
        state.checkpoints.num-retained: 2
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    volumes:
      - flink_jobmanager_data:/opt/flink/data
      - flink_checkpoints:/opt/flink/checkpoints   # compartido con el TaskManager
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/overview"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - bigdata-network

  flink-taskmanager:
    <<: *flink-image
    container_name: bigdata-flink-taskmanager
    restart: unless-stopped
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    command: taskmanager
    environment:
      <<: *flink-db-env
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m
        metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
        metrics.reporter.prom.port: 9249
        state.checkpoints.dir: file:///opt/flink/checkpoints/checkpoints
        state.savepoints.dir: file:///opt/flink/checkpoints/savepoints
        state.checkpoints.num-retained: 2
        execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
    volumes:
      - flink_taskmanager_data:/opt/flink/data
      - flink_checkpoints:/opt/flink/checkpoints
    healthcheck:
      test: ["CMD", "pgrep", "-f", "taskmanager"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - bigdata-network

  postgres:
    image: postgres:15.6-alpine
    container_name: bigdata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bigdata_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bigdata_pass}
      POSTGRES_DB: ${POSTGRES_DB:-bigdata}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bigdata-network

volumes:
  redpanda_data:
  prometheus_data:
  loki_data:
  grafana_data:
  flink_jobmanager_data:
  flink_taskmanager_data:
  flink_checkpoints:
  postgres_data:

networks:
  bigdata-network:
    driver: bridge
