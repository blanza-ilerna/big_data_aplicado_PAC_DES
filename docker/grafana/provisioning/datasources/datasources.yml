apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true

  # Resultados del job de Flink
  - name: PostgreSQL
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: bigdata_user
    jsonData:
      database: bigdata
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: bigdata_pass
    editable: true
