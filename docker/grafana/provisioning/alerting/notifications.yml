# Notificaciones de las alertas.
#
# No hay servidor de correo (SMTP), así que si Grafana intenta avisar por email
# llena el log de errores "SMTP not configured". Para evitarlo, las alertas del
# pipeline se silencian siempre (mute timing "siempre"): siguen apareciendo en
# Alerting -> Alert rules con su estado (Normal / Pending / Firing), pero no se
# envía nada.
#
# Para recibir avisos de verdad: cambia el contact point "sin-avisos" por uno real
# (Slack, Discord, email con SMTP...) y quita "mute_time_intervals" de la ruta.
apiVersion: 1

# Contact point propio: las políticas no pueden apuntar a "grafana-default-email"
# porque en Grafana 13 todavía no existe cuando se cargan estos archivos.
# Nunca recibe nada mientras la ruta esté silenciada.
contactPoints:
  - orgId: 1
    name: sin-avisos
    receivers:
      - uid: sin-avisos-webhook
        type: webhook
        settings:
          url: http://localhost:9/sin-avisos
        disableResolveMessage: true

muteTimes:
  - orgId: 1
    name: siempre
    time_intervals:
      - times:
          - start_time: "00:00"
            end_time: "24:00"

policies:
  - orgId: 1
    receiver: sin-avisos
    group_by: ["grafana_folder", "alertname"]
    routes:
      # Todas las reglas del pipeline llevan la etiqueta "severity"
      - receiver: sin-avisos
        object_matchers:
          - ["severity", "=~", ".+"]
        mute_time_intervals:
          - siempre
